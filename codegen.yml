schema: ./graphql/schema.graphql
documents: ./graphql/**/*.graphql
generates:
  ./types/generated/graphql.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-query
    config:
      fetcher:
        func: '../../lib/fetcher#customFetcher'
        isReactHook: false
        isAsync: true
      exposeQueryKeys: true
      exposeMutationKeys: true
      reactQueryVersion: 5
